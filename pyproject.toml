[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "denvercrime"
version = "0.1.0"
description = "Weekly spatiotemporal crime-count forecasting for Denver on an H3 grid"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Taimour Khan" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "h3>=4.1",
    "lightgbm>=4.3",
    "requests>=2.31",
    "folium>=0.17",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::UserWarning:lightgbm"]
